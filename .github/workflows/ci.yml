name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Import smoke
        run: |
          python -c "from iomeshclient import connect, ConnectOptions, VERSION; print(VERSION)"
          python -c "from iomeshclient.kafka import KafkaClient; print(KafkaClient)"
          python -c "import pathlib, iomeshclient; p=pathlib.Path(iomeshclient.__file__).with_name('py.typed'); assert p.is_file(), p; print('py.typed', p)"

      - name: pytest
        run: python -m pytest -q

      - name: ruff (optional)
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check src tests examples
          else
            echo "ruff not installed; skipping"
          fi

      # Full mypy/pyright is optional residual (see docs/1.0-bar.md) — not a required gate.
