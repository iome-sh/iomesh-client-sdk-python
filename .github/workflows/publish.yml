# Publish sdist + wheel to PyPI on GitHub Release publish (or manual dispatch).
# Requires repository secret PYPI_TOKEN (PyPI API token). Never commit tokens.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (skip twine upload)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  publish:
    name: build + upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload to PyPI
        if: >
          (github.event_name == 'release') ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "PYPI_TOKEN secret not set; skipping upload (build artifacts retained)."
            ls -la dist/
            exit 0
          fi
          twine upload dist/*
