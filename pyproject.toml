[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iomeshclient"
version = "0.4.0"
description = "Official Python client SDK for I/O Mesh (HTTP + Kafka Produce subset: connect, publish, streams, KV, memory, catalog, policy, connectorsdk, wait_ready)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "IOMesh Technology Ltd." }]
keywords = ["iomesh", "i/o mesh", "event streams", "client-sdk", "kafka"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://iome.sh"
Repository = "https://github.com/iome-sh/iomesh-client-sdk-python"
Documentation = "https://github.com/iome-sh/iomesh-client-sdk-python#readme"
Issues = "https://github.com/iome-sh/iomesh-client-sdk-python/issues"
Changelog = "https://github.com/iome-sh/iomesh-client-sdk-python/blob/main/CHANGELOG.md"
"Go SDK" = "https://github.com/iome-sh/iomesh-client-sdk-go"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/iomeshclient"]

[tool.hatch.build.targets.sdist]
include = [
  "src/iomeshclient",
  "tests",
  "examples",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "RELEASING.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["UP045"]  # Optional[] is fine for 3.10+ readability parity with Go SDK docs

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["EXE001", "BLE001", "T201"]
"tests/*" = ["BLE001"]
